name: hoodik_app
description: "Hoodik - End-to-End Encrypted Cloud Storage"
publish_to: "none"
version: 2.3.0+56

environment:
    sdk: ^3.11.4

dependencies:
    flutter:
        sdk: flutter
    flutter_localizations:
        sdk: flutter
    intl: any
    cupertino_icons: ^1.0.8
    flutter_rust_bridge: 2.11.1

    # Injectable wall clock — use `clock.now()` instead of `DateTime.now()`
    # so goldens / unit tests can pin "now" via `withClock(Clock.fixed(...))`.
    clock: ^1.1.1

    # State management
    flutter_riverpod: ^2.6.1

    # Routing
    go_router: ^14.8.1

    # HTTP client
    dio: ^5.7.0

    # Local database (offline cache)
    drift: ^2.22.1
    sqlite3_flutter_libs: ^0.5.28

    # Key-value preferences (view mode, default landing tab, etc.)
    shared_preferences: ^2.3.4

    # File system
    path_provider: ^2.1.5
    share_plus: ^10.1.4
    file_picker: ^8.1.7
    image_picker: ^1.1.2

    # Desktop drag-and-drop
    desktop_drop: ^0.5.0

    # Mobile share intent handling
    flutter_sharing_intent: ^2.0.4

    # Connectivity
    connectivity_plus: ^6.1.3

    # Permissions
    permission_handler: ^11.3.1

    # Biometric authentication
    local_auth: ^2.3.0
    flutter_secure_storage: ^9.2.4

    # Preview
    webview_flutter: ^4.10.0
    photo_view: ^0.15.0
    video_thumbnail: ^0.5.3
    pdfx: ^2.8.0
    media_kit: ^1.2.6
    media_kit_video: ^2.0.1
    media_kit_libs_video: ^1.0.7

    # URL launcher (legal links, App Store deep link, server chooser card)
    url_launcher: ^6.3.1

    # App-update nudge: Google Play in-app updates (Android) + running-version
    # lookup for the App Store version check (iOS/macOS)
    in_app_update: ^4.2.3
    package_info_plus: ^9.0.1

    # Notes — PDF export of markdown content (parser + PDF builder + share sheet)
    pdf: ^3.11.0
    printing: ^5.13.0
    markdown: ^7.3.0

    # Hashing (streaming SHA-256 for isolates)
    crypto: ^3.0.6

    # UI
    shimmer: ^3.0.0
    path: ^1.9.1
    uuid: ^4.5.3
    dio_cookie_manager: ^3.4.0
    cookie_jar: ^4.0.9
    hoodik_mobile:
        path: rust_builder
    background_downloader: ^9.5.4
    tray_manager: ^0.5.2

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^6.0.0
    flutter_launcher_icons: ^0.14.3
    build_runner: ^2.13.1
    drift_dev: ^2.32.1
    mockito: ^5.4.5
    # Lets tests swap in a recording fake for url_launcher.
    url_launcher_platform_interface: ^2.3.2
    integration_test:
        sdk: flutter
    ffigen: ^20.1.1

    # Release-check Phase 1 — Patrol for E2E on iOS + Android native runtimes.
    # The CLI/package versions DO NOT match despite similar-looking numbers.
    # Per patrol_cli's compatibility table:
    #   patrol_cli 3.11.0+  pairs with  patrol 3.20.0+  (min Flutter 3.32.0)
    # Pin the package to the bottom of that range; pin the CLI separately on
    # the dev machine: `dart pub global activate patrol_cli 3.11.0`.
    patrol: 3.20.0
    # Lets tests swap in a fake FilePicker platform (MockPlatformInterfaceMixin).
    plugin_platform_interface: ^2.1.8
    # mutation_testing: ^0.0.5  # Phase 2 — crypto mutation coverage

flutter_launcher_icons:
    android: true
    ios: true
    remove_alpha_ios: true
    image_path: "assets/icon.png"
    adaptive_icon_background: "#1a1a2e"
    adaptive_icon_foreground: "assets/icon.png"
    macos:
        generate: true
        image_path: "assets/icon.png"
    windows:
        generate: true
        image_path: "assets/icon.png"
    linux:
        generate: true
        image_path: "assets/icon.png"

flutter:
    uses-material-design: true
    generate: true
    assets:
        - assets/editor/
        - assets/icon.png
        - assets/icon_mcp_running.png
