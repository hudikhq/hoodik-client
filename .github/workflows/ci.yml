name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    # For e2e-transfer-r2: an on-demand run of the round trip against the real
    # R2 testing bucket instead of MinIO.
    workflow_dispatch:

jobs:
    analyze-and-test:
        name: release-check-fast
        runs-on: ubuntu-latest
        env:
            # ci.yml runs on ubuntu-latest, which lacks a simulator for the
            # integration tier (Rust FFI needs a real runtime). The nightly
            # release-check.yml covers integration on macOS; here we skip cleanly.
            HOODIK_SKIP_INTEGRATION_WITHOUT_DEVICE: "1"
            # Fast path never touches docker (only E2E does).
            HOODIK_PREFLIGHT_NO_DOCKER: "1"
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Free disk space
              # Building the host Rust FFI (release) alongside Flutter and the
              # deps can overrun the runner disk; drop preinstalled SDKs the job
              # never uses (Android alone is ~9 GB).
              run: |
                  sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                    /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
                  df -h /

            - uses: subosito/flutter-action@v2
              with:
                  flutter-version: "3.41.x"
                  channel: stable

            # Use taiki-e/install-action's `@just` shorthand: it pulls
            # the just binary directly from casey/just's release assets
            # and installs to PATH, no GitHub-releases-API matching to
            # fail on. extractions/setup-just@v2 worked for a while but
            # broke twice in 24 h with "no release for just matching
            # version specifier 1.47.1" even though that version exists
            # — the action's release-listing path mis-handles certain
            # versions. taiki-e is single-purpose and rock solid; many
            # CI workflows use it for rust tools precisely because of
            # this kind of flake.
            - uses: taiki-e/install-action@just

            # The unit suite now exercises the Rust FFI, so the host library has
            # to exist: frb's default loader opens rust/target/release/
            # libhoodik_mobile.so. Build it from the shared crates in the hoodik
            # repo — the fast path can no longer stub hoodik.
            - name: Clone hoodik (shared Rust crates)
              uses: ./.github/actions/clone-hoodik
              with:
                  pinned: ${{ vars.HOODIK_BRANCH }}

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: rust -> target

            - uses: awalsh128/cache-apt-pkgs-action@latest
              with:
                  packages: clang llvm pkg-config nettle-dev libpq-dev libc6-dev
                  version: 1.0

            - name: Build host FFI library
              run: cd rust && cargo build --release

            - run: flutter pub get

            - name: release-check-fast (format + analyze + invariants + unit)
              run: just release-check-fast

    build-verify-ios:
        name: Build Verify (iOS, no codesign)
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4

            - name: Clone hoodik (for shared Rust crates)
              uses: ./.github/actions/clone-hoodik
              with:
                  pinned: ${{ vars.HOODIK_BRANCH }}

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-apple-ios

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: rust -> target
                  key: ios-ci

            - uses: subosito/flutter-action@v2
              with:
                  flutter-version: "3.41.x"
                  channel: stable

            - run: flutter pub get

            - name: Build iOS with retry on transient pod or git failures
              shell: bash
              run: |
                  set -euo pipefail
                  for attempt in 1 2 3; do
                    if flutter build ios --release --no-codesign; then
                      exit 0
                    fi

                    if [ "$attempt" -eq 3 ]; then
                      exit 1
                    fi

                    echo "iOS build failed on attempt $attempt — cleaning CocoaPods state and retrying..."
                    rm -rf ios/Pods ios/Podfile.lock
                    pod cache clean --all || true
                    sleep 20
                  done

    # A file's bytes reach the device one of three ways and the server picks
    # which, so all three are booted and exercised. Every transfer bug this
    # repo has shipped — a progress bar that never moved, an archive refusal
    # that reached the user instead of falling back, an FFI binding that threw
    # on every call — lived in whichever leg nothing here was running.
    e2e-transfer:
        name: Transfer round trip (${{ matrix.mode }}, MinIO)
        runs-on: ubuntu-latest
        strategy:
            # One failing leg must not cancel the others: which legs pass tells
            # you where the fault is.
            fail-fast: false
            matrix:
                mode: [direct, tar, chunk]
        steps:
            - uses: actions/checkout@v4

            - name: Free disk space
              run: |
                  sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                    /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
                  df -h /

            - name: Clone hoodik (server + shared Rust crates)
              uses: ./.github/actions/clone-hoodik
              with:
                  pinned: ${{ vars.HOODIK_BRANCH }}

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2
              with:
                  # Two workspaces: the FFI library the test loads, and the
                  # server binary the recipe boots.
                  workspaces: |
                      rust -> target
                      ../hoodik -> target
                  # Shared across the matrix: the three legs differ only in how
                  # the same binary is configured, so they must not each build
                  # and cache their own copy of it.
                  key: e2e-transfer

            - uses: awalsh128/cache-apt-pkgs-action@latest
              with:
                  packages: clang llvm pkg-config nettle-dev libpq-dev libc6-dev
                  version: 1.0

            - uses: subosito/flutter-action@v2
              with:
                  flutter-version: "3.41.x"
                  channel: stable

            - uses: taiki-e/install-action@just

            - run: flutter pub get

            # Boots MinIO and the paired server configured for this leg, then
            # runs the round trip: register, upload, finalize, download,
            # byte-for-byte compare. The recipe refuses to proceed if the
            # server came up in a shape that would run some other leg.
            - name: Live round trip
              run: just e2e-transfer ${{ matrix.mode }}

    e2e-transfer-r2:
        name: Transfer round trip (direct, R2 — manual)
        # On demand only: it spends real R2 operations and needs the repo's
        # secrets, which forked PRs never see. The MinIO job above is the
        # hermetic per-PR gate; this one proves the same round trip against
        # the bucket implementation production actually runs on.
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        env:
            S3_ENDPOINT: ${{ secrets.R2_TEST_ENDPOINT }}
            S3_BUCKET: ${{ secrets.R2_TEST_BUCKET }}
            S3_ACCESS_KEY: ${{ secrets.R2_TEST_ACCESS_KEY }}
            S3_SECRET_KEY: ${{ secrets.R2_TEST_SECRET_KEY }}
            S3_REGION: auto
            # Its own prefix, so CI runs never collide with the phone rig's
            # r2clean/ data in the same bucket.
            S3_PREFIX: ci-live/
        steps:
            - uses: actions/checkout@v4

            # The recipe falls back to MinIO defaults for any S3 variable
            # that is empty, which is right for local runs and wrong here: a
            # dispatch on a repo without the secrets would go green against
            # MinIO while claiming R2 coverage.
            - name: Require the R2 secrets
              run: |
                  for var in S3_ENDPOINT S3_BUCKET S3_ACCESS_KEY S3_SECRET_KEY; do
                    if [ -z "${!var}" ]; then
                      echo "$var is empty — configure the R2_TEST_* secrets; this job proves R2, not MinIO" >&2
                      exit 1
                    fi
                  done

            - name: Free disk space
              run: |
                  sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                    /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
                  df -h /

            - name: Clone hoodik (server + shared Rust crates)
              uses: ./.github/actions/clone-hoodik
              with:
                  pinned: ${{ vars.HOODIK_BRANCH }}

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: |
                      rust -> target
                      ../hoodik -> target
                  key: e2e-transfer

            - uses: awalsh128/cache-apt-pkgs-action@latest
              with:
                  packages: clang llvm pkg-config nettle-dev libpq-dev libc6-dev
                  version: 1.0

            - uses: subosito/flutter-action@v2
              with:
                  flutter-version: "3.41.x"
                  channel: stable

            - uses: taiki-e/install-action@just

            - run: flutter pub get

            - name: Live direct-transfer round trip against R2
              run: just e2e-transfer direct
