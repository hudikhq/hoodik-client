name: Contributor License Agreement

# Asks first-time contributors to sign CLA.md before their pull request can be
# merged. Signatures are stored in signatures/cla.json in this repository, so
# no third-party service holds contributor data. They live on their own branch
# because signing is a direct write, and the action does not reliably resolve
# its signature store when that store is the base branch — the allowlist is
# ignored and every PR fails with "committers have to sign". hoodik hit this
# first and fixed it the same way.
# Runs on pull_request_target with write permissions, so this workflow must
# never check out or run anything from the PR branch.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check or request signature
        if: (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/hudikhq/hoodik-client/blob/main/CLA.md
          branch: cla-signatures
          allowlist: htunlogic,dependabot[bot]
